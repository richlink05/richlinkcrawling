name: RichLink 분양정보 자동 수집

on:
  schedule:
    # 분양현장은 실시간으로 바뀌지 않으므로 주 1회만 실행한다.
    # GitHub Actions의 cron은 UTC 기준이라, 한국시간 월요일 03:00은
    # UTC로 일요일 18:00이다.
    - cron: "0 18 * * 0"
  workflow_dispatch: {}   # Actions 탭에서 "Run workflow" 버튼으로 수동 실행도 가능

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: Python 3.12 설치
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 의존성 설치
        run: pip install -e .

      - name: Playwright 브라우저 설치
        run: playwright install --with-deps chromium

      - name: 분양정보 수집 + 홈해버 전송
        env:
          # RichLink 자신의 수집함 DB (홈해버 DB와는 완전히 별개의 Supabase 프로젝트)
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          # 홈해버 등록 API — 직접 DB에 연결하지 않고 이 API만 호출한다
          HOMEHAVER_API_URL: ${{ secrets.HOMEHAVER_API_URL }}
          HOMEHAVER_API_TOKEN: ${{ secrets.HOMEHAVER_API_TOKEN }}
          MAX_CONCURRENT_SPIDERS: "20"
        run: python -m backend.scheduler.run_once
