name: DB 마이그레이션 적용 (수동 실행)

# Actions 탭에서 "Run workflow" 버튼을 눌러야만 실행된다 (자동 실행 아님).
# Supabase(또는 다른 Postgres)에 테이블을 처음 만들거나, 모델이 바뀌었을 때 사용한다.
on:
  workflow_dispatch: {}

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: Python 3.12 설치
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 의존성 설치
        run: pip install -e .

      - name: Alembic 마이그레이션 적용
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: alembic upgrade head
